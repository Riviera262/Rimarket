services:
  postgres:
    image: postgres:17
    container_name: RiMarket

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro


  redis:
    image: redis:7-alpine
    container_name: RiMarket-Redis

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data


volumes:
  redis_data:
  postgres_data: