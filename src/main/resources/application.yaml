spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # This tells Spring to respect your SQL schemas, do not let JPA touch it
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        generate_statistics: true
        default_schema: public # Default fallback
        default_batch_fetch_size: 100

  config:
    import: "optional:file:../private/rimarket-secret.env[.properties]"

  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 45MB

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME}
  api-key: ${CLOUDINARY_API_KEY}
  api-secret: ${CLOUDINARY_API_SECRET}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.stat: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE

application:
  security:
    jwt:
      # This is a random 256-bit secure key.
      secret-key: ${JWT_SECRET}
      access-token-expiration: 900      # 15 minutes by seconds(60 * 15)
      refresh-token-expiration: 604800  # 7 days by seconds(* 60 * 60 * 24 * 7)
    cookie:
      secure: false
  base-url: http://localhost:8080

server:
  port: 8080